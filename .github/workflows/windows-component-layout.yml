name: Windows component layout

on:
  push:
    branches:
      - main
      - test/windows-component-layout
  pull_request:
    paths:
      - 'windows/windows-layout.ps1'
      - 'windows/initialize-windows-layout.ps1'
      - 'windows/test-windows-layout.ps1'
      - 'windows/windows-layout-migration.ps1'
      - 'windows/notification-layout-copy.ps1'
      - 'windows/stage-windows-notifications.ps1'
      - 'windows/migrate-notification-layout.ps1'
      - 'windows/layout-directory-identity.cs'
      - 'windows/test-windows-layout-migration.ps1'
      - 'windows/hosts-layout.ps1'
      - 'windows/test-hosts-layout.ps1'
      - 'windows/test-widget-layout.ps1'
      - 'windows/widgets/scripts/Widget-Layout.ps1'
      - 'windows/widgets/scripts/Migrate-WidgetLayout.ps1'
      - 'windows/widgets/scripts/Migrate-DevStackWindows.ps1'
      - 'windows/install-hosts-sync.ps1'
      - 'windows/watch-hosts.ps1'
      - 'windows/setup-windows.ps1'
      - '.github/workflows/windows-component-layout.yml'

permissions:
  contents: read

jobs:
  layout:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse PowerShell layout scripts
        shell: powershell
        run: |
          foreach ($path in @('windows/windows-layout.ps1', 'windows/initialize-windows-layout.ps1', 'windows/test-windows-layout.ps1', 'windows/windows-layout-migration.ps1', 'windows/test-windows-layout-migration.ps1', 'windows/notification-layout-copy.ps1', 'windows/stage-windows-notifications.ps1', 'windows/migrate-notification-layout.ps1', 'windows/hosts-layout.ps1', 'windows/test-hosts-layout.ps1', 'windows/install-hosts-sync.ps1', 'windows/watch-hosts.ps1', 'windows/setup-windows.ps1', 'windows/test-widget-layout.ps1', 'windows/widgets/scripts/Widget-Layout.ps1', 'windows/widgets/scripts/Migrate-WidgetLayout.ps1', 'windows/widgets/scripts/Migrate-DevStackWindows.ps1')) {
            $tokens = $null
            $errors = $null
            [Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { $errors | Format-List; throw "Cannot parse $path" }
          }
      - name: Verify fresh provisioning and fail-closed behavior on NTFS
        shell: powershell
        run: ./windows/test-windows-layout.ps1

      - name: Verify root publication and recoverable rollback on NTFS
        shell: powershell
        run: ./windows/test-windows-layout-migration.ps1

      - name: Verify protected Hosts releases and scheduled task action switch
        shell: powershell
        run: ./windows/test-hosts-layout.ps1

      - name: Verify widget data migration and private file ACLs
        shell: powershell
        run: ./windows/test-widget-layout.ps1
