name: DevStack isolated PHP runtime prototype

on:
  pull_request:
    branches: [main]
    paths:
      - 'daemon/project_runtime.py'
      - 'daemon/project_mounts.py'
      - 'daemon/project_idmap.py'
      - 'daemon/project_data_views.py'
      - 'daemon/project_runtime_launch.py'
      - 'daemon/project_runtime_identity.py'
      - 'daemon/project_access.py'
      - 'tests/test_project_access.py'
      - 'tests/test_project_runtime_identity.py'
      - 'tests/test_project_mounts.py'
      - 'tests/project-mount-fd-smoke.py'
      - 'daemon/project_http.py'
      - 'daemon/project_lifecycle.py'
      - 'tests/test_project_lifecycle.py'
      - 'tests/project_http_smoke.py'
      - 'tests/project-runtime-systemd-smoke.py'
      - 'tests/project-idmap-smoke.py'
      - '.github/workflows/project-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'daemon/project_runtime.py'
      - 'daemon/project_mounts.py'
      - 'daemon/project_idmap.py'
      - 'daemon/project_data_views.py'
      - 'daemon/project_runtime_launch.py'
      - 'daemon/project_runtime_identity.py'
      - 'daemon/project_access.py'
      - 'tests/test_project_access.py'
      - 'tests/test_project_runtime_identity.py'
      - 'tests/test_project_mounts.py'
      - 'tests/project-mount-fd-smoke.py'
      - 'daemon/project_http.py'
      - 'daemon/project_lifecycle.py'
      - 'tests/test_project_lifecycle.py'
      - 'tests/project-runtime-systemd-smoke.py'
      - 'tests/project-idmap-smoke.py'
      - 'tests/project_http_smoke.py'
      - '.github/workflows/project-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    name: Two isolated project runtimes, HTTPS and transactional lifecycle
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install runtime dependencies on disposable runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap acl libfcgi-bin php8.5-fpm php8.5-cli php8.5-sqlite3 nginx openssl
      - name: Check and exercise prototype
        run: |
          python3 -m py_compile daemon/project_runtime.py daemon/project_http.py daemon/project_lifecycle.py tests/project-runtime-systemd-smoke.py tests/project_http_smoke.py
          python3 -m py_compile daemon/project_mounts.py daemon/project_runtime_launch.py tests/project-mount-fd-smoke.py tests/test_project_mounts.py
          python3 -m py_compile daemon/project_runtime_identity.py tests/test_project_runtime_identity.py
          python3 -m py_compile daemon/project_access.py daemon/project_idmap.py daemon/project_data_views.py tests/test_project_access.py tests/project-idmap-smoke.py
          python3 -m unittest discover -s tests -p test_project_access.py -v
          python3 -m unittest discover -s tests -p test_project_runtime_identity.py -v
          python3 -m unittest discover -s tests -p test_project_lifecycle.py -v
          python3 -m unittest discover -s tests -p test_project_mounts.py -v
          python3 -I tests/project-mount-fd-smoke.py
          sudo env GITHUB_ACTIONS=true DEVSTACK_RUNTIME_CI=1 python3 -I tests/project-runtime-systemd-smoke.py
