name: Bubblewrap LTS backport experiment

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/bubblewrap-backport-ci.sh'
      - 'daemon/project_mounts.py'
      - 'daemon/devstackd.py'
      - 'frontend/**'
      - 'framework-installers/**'
      - 'scripts/install.sh'
      - 'scripts/apply-update.sh'
      - 'tests/project-activation-ci.sh'
      - 'tests/project-activation-smoke.py'
      - 'daemon/project_idmap.py'
      - 'daemon/project_pilot.py'
      - 'daemon/project_executor.py'
      - 'tests/project-executor-*.py'
      - 'tests/project_executor_workstation.py'
      - 'tests/test_project_executor_workstation.py'
      - 'tests/test_project_executor.py'
      - 'tests/project-registered-pilot-smoke.py'
      - 'tests/test_project_pilot.py'
      - 'daemon/project_data_views.py'
      - 'daemon/project_runtime_launch.py'
      - 'daemon/project_runtime_identity.py'
      - 'daemon/project_access.py'
      - 'tests/test_project_access.py'
      - 'tests/test_project_runtime_identity.py'
      - 'daemon/project_runtime.py'
      - 'daemon/project_http.py'
      - 'daemon/project_lifecycle.py'
      - 'tests/test_project_mounts.py'
      - 'tests/project-mount-fd-smoke.py'
      - 'tests/project-runtime-systemd-smoke.py'
      - 'tests/project-idmap-smoke.py'
      - 'tests/project_http_smoke.py'
      - 'tests/bubblewrap_backport_compat.py'
      - 'tests/test_bubblewrap_backport_compat.py'
      - '.github/workflows/bubblewrap-backport.yml'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tests/bubblewrap-backport-ci.sh'
      - 'daemon/project_mounts.py'
      - 'daemon/devstackd.py'
      - 'frontend/**'
      - 'framework-installers/**'
      - 'scripts/install.sh'
      - 'scripts/apply-update.sh'
      - 'tests/project-activation-ci.sh'
      - 'tests/project-activation-smoke.py'
      - 'daemon/project_idmap.py'
      - 'daemon/project_pilot.py'
      - 'daemon/project_executor.py'
      - 'tests/project-executor-*.py'
      - 'tests/project_executor_workstation.py'
      - 'tests/test_project_executor_workstation.py'
      - 'tests/test_project_executor.py'
      - 'tests/project-registered-pilot-smoke.py'
      - 'tests/test_project_pilot.py'
      - 'daemon/project_data_views.py'
      - 'daemon/project_runtime_launch.py'
      - 'daemon/project_runtime_identity.py'
      - 'daemon/project_access.py'
      - 'tests/test_project_access.py'
      - 'tests/test_project_runtime_identity.py'
      - 'daemon/project_runtime.py'
      - 'daemon/project_http.py'
      - 'daemon/project_lifecycle.py'
      - 'tests/test_project_mounts.py'
      - 'tests/project-mount-fd-smoke.py'
      - 'tests/project-runtime-systemd-smoke.py'
      - 'tests/project-idmap-smoke.py'
      - 'tests/project_http_smoke.py'
      - 'tests/bubblewrap_backport_compat.py'
      - 'tests/test_bubblewrap_backport_compat.py'
      - '.github/workflows/bubblewrap-backport.yml'

permissions:
  contents: read

jobs:
  backport:
    name: Authenticated source rebuild on Ubuntu 26.04 amd64
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check script syntax and packaging transformation
        run: |
          bash -n tests/bubblewrap-backport-ci.sh
          python3 -m py_compile tests/bubblewrap_backport_compat.py tests/test_bubblewrap_backport_compat.py
          python3 -m unittest discover -s tests -p test_bubblewrap_backport_compat.py -v
      - name: Build, test and roll back the temporary package
        run: bash tests/bubblewrap-backport-ci.sh
      - name: Installed runtime diagnostics
        if: failure()
        run: |
          sudo journalctl -u devstackd -u nginx -u php8.5-fpm -u devstack-mailpit -u 'devstack-pilot-*' --no-pager -n 180
          sudo tail -60 /var/log/nginx/error.log
      - uses: actions/upload-artifact@v4
        with:
          name: bubblewrap-resolute-test-backport-amd64
          path: bubblewrap-backport-ci-output/
          if-no-files-found: error
          retention-days: 7
