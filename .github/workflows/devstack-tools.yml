name: DevStack Tools

on:
  push:
    branches: [main]
    paths:
      - 'extensions/devstack-tools/**'
      - '.github/workflows/devstack-tools.yml'
  pull_request:
    branches: [main]
    paths:
      - 'extensions/devstack-tools/**'
      - '.github/workflows/devstack-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devstack-tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tools:
    name: Shared Playwright install, CLI, update and rollback
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and public repository secret guard
        run: |
          for f in extensions/devstack-tools/*.sh extensions/devstack-tools/bin/* extensions/devstack-tools/tests/*.sh; do
            bash -n "$f"
          done
          node --check extensions/devstack-tools/smoke.cjs
          bash scripts/security-scan.sh
      - name: Real installation and lifecycle
        run: |
          # Standard product permissions while retaining runner ACL defaults.
          test "$(stat -c %u /opt)" = 0
          test ! -L /opt
          sudo chmod go-w /opt
          bash extensions/devstack-tools/tests/installed-smoke.sh
  mail:
    name: DevStack Mail unit tests and real read-only Mailpit
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      DEVSTACK_MAIL_TEST_DISPOSABLE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: CLI, MIME and transport unit tests
        run: python3 -m unittest discover -s extensions/devstack-tools/tests -p 'test_*.py' -v
      - name: Exercise a separate disposable mailbox
        run: |
          fixture=extensions/devstack-tools/tests/mailpit-smoke.py
          python3 -IB "$fixture" missing
          sudo bash scripts/install-mailpit.sh
          test "$(cat /opt/devstack-mailpit/VERSION)" = v1.34.0
          python3 -IB "$fixture" ready
          sudo systemctl stop devstack-mailpit.service
          python3 -IB "$fixture" stopped
          test "$(systemctl is-active devstack-mailpit.service || true)" = inactive
