name: DevStack CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: PHP, Python and security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - name: Syntax checks
        run: |
          php -l backend/public/index.php
          php -l backend/security.php
          php -l scripts/set-password.php
          php -l scripts/configure-auth.php
          bash -n scripts/install.sh scripts/bootstrap-ubuntu.sh scripts/preflight.sh scripts/build-frontend.sh scripts/security-scan.sh scripts/backup-project-db.sh scripts/verify-project-db-backup.sh
          python3 -m py_compile daemon/devstackd.py scripts/list-domains.py scripts/watch-domains.py
      - name: Backend unit tests
        run: |
          python3 -m unittest discover -s tests -v
          php tests/php-security.php
      - name: Backup scripts reject invalid inputs
        run: |
          if bash scripts/backup-project-db.sh 'unsafe/slug'; then
            echo 'Backup script unexpectedly accepted an invalid slug' >&2
            exit 1
          fi
          if bash scripts/verify-project-db-backup.sh /path/that/does/not/exist.sql.gz; then
            echo 'Restore script unexpectedly accepted a missing file' >&2
            exit 1
          fi
      - name: Public repository secret guard
        run: bash scripts/security-scan.sh

  frontend:
    name: React + shadcn/UI build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript and production Vite build
        run: npm run build
      - name: Validate generated files
        working-directory: .
        run: |
          test -s backend/public/index.html
          test -d backend/public/assets
          test -n "$(find backend/public/assets -type f -name '*.js' -print -quit)"
          test -n "$(find backend/public/assets -type f -name '*.css' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: devstack-frontend-build
          path: |
            backend/public/index.html
            backend/public/assets/
          if-no-files-found: error
          retention-days: 7

  powershell:
    name: Windows scripts parse
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          Get-ChildItem 'windows/*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -ne 0) { $errors | Format-Table; throw "PowerShell parse error in $($_.Name)" }
          }
      - name: Hosts transformation regression tests
        shell: powershell
        run: ./windows/test-hosts.ps1
