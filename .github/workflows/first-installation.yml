name: DevStack - First Installation Package

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/first-installation.yml'
      - 'windows/Build-FirstInstallation.ps1'
      - 'docs/FIRST-INSTALLATION-PACKAGE.md'

permissions:
  contents: read

jobs:
  package:
    name: Build verified Windows x64 and WSL source package
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    uses: ./.github/workflows/widgets.yml
    with:
      first_install: true
