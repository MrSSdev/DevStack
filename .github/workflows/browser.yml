name: DevStack browser and real mailbox

on:
  push:
    branches: [test/windows-local-notifications]
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'daemon/**'
      - 'scripts/install.sh'
      - 'scripts/apply-update.sh'
      - 'scripts/update.sh'
      - 'scripts/devstack-notifications.service'
      - 'scripts/devstack-notifications.timer'
      - 'scripts/notifications-worker.php'
      - 'scripts/install-mailpit.sh'
      - 'tests/browser-smoke.py'
      - 'tests/extensions-browser-smoke.py'
      - 'extensions/devstack-tools/**'
      - 'tests/windows-notification-systemd-smoke.py'
      - '.github/workflows/browser.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Installed stack, Chromium, themes and SMTP
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build production UI
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm test && npm run build
      - name: Install real stack in the disposable runner
        run: |
          # The product targets Ubuntu 26.04. The 24.04 CI image needs the
          # upstream PHP packaging repository for the same 8.5 FPM packages.
          sudo add-apt-repository -y ppa:ondrej/php
          # Hosted runner images may relax /opt for preinstalled developer SDKs.
          # The disposable product fixture uses standard protected /opt.
          stat -c 'Fixture /opt: uid=%u mode=%a type=%F' /opt
          test "$(stat -c %u /opt)" = 0
          test ! -L /opt
          sudo chmod go-w /opt
          mkdir -p "$HOME/projects"
          printf '2\nDISABLE\n' | sudo bash scripts/install.sh
          sudo bash scripts/install-mailpit.sh
          composer global require laravel/installer:^5.33 --no-interaction --no-progress
          sudo apt-get install -y libnss3-tools
          echo '127.0.0.1 devstack.test' | sudo tee -a /etc/hosts
          sudo cp /var/lib/devstack/ca/rootCA.pem /usr/local/share/ca-certificates/devstack-browser.crt
          sudo update-ca-certificates
          mkdir -p "$HOME/.pki/nssdb"
          certutil -N --empty-password -d "sql:$HOME/.pki/nssdb"
          certutil -A -d "sql:$HOME/.pki/nssdb" -n DevStack-browser-fixture -t 'C,,' -i /usr/local/share/ca-certificates/devstack-browser.crt
          python3 - <<'PY'
          import os, secrets, subprocess
          password = secrets.token_urlsafe(32)
          print('::add-mask::' + password)
          subprocess.run(['sudo', 'php', '-r', '$p = stream_get_contents(STDIN); file_put_contents("/etc/devstack/auth.hash", password_hash($p, PASSWORD_DEFAULT)); chown("/etc/devstack/auth.hash", "root"); chgrp("/etc/devstack/auth.hash", "devstackweb"); chmod("/etc/devstack/auth.hash", 0640);'], input=password, text=True, check=True)
          subprocess.run(['sudo', 'sh', '-c', 'printf "required\\n" > /etc/devstack/auth.mode'], check=True)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('DEVSTACK_E2E_PASSWORD=' + password + '\n')
          PY
      - name: Verify legacy web-state permissions during a real update
        run: |
          sudo systemctl stop devstack-notifications.timer
          sudo systemctl stop devstack-notifications.service
          sudo -u devstackweb /usr/bin/php -r 'require "/opt/devstack/notifications.php"; $db = new DevStackNotices(); $db->setCategories(["mail"]);'
          # Fixture of the obsolete metadata and old installed helper files.
          # No real endpoint, private key or sender is ever executed.
          sudo -u devstackweb /usr/bin/php -r '$db=new PDO("sqlite:/var/lib/devstack-web/notifications.sqlite3"); $db->prepare("INSERT OR REPLACE INTO metadata(key,value) VALUES (?,?)")->execute(["subscription","legacy fixture"]);'
          sudo touch /opt/devstack/push-helper.php /opt/devstack/scripts/notification-push.py
          # Reproduce the existing-workstation failure without deleting any
          # database content. This runner is a disposable installation.
          sudo chown root:root /var/lib/devstack-web
          sudo chmod 0755 /var/lib/devstack-web
          mkdir -p "$HOME/projects/devstack-source"
          cp -a backend daemon framework-installers scripts "$HOME/projects/devstack-source/"
          (cd "$HOME/projects/devstack-source"; sudo bash scripts/apply-update.sh)
          test "$(sudo stat -c '%U:%G:%a' /var/lib/devstack-web)" = 'devstackweb:devstackweb:700'
          test "$(systemctl show -p Result --value devstack-notifications.service)" = success
          test "$(systemctl show -p ExecMainStatus --value devstack-notifications.service)" = 0
          systemctl is-active --quiet devstack-notifications.timer
          sudo -u devstackweb /usr/bin/php -r 'require "/opt/devstack/notifications.php"; $db = new DevStackNotices(); if ($db->categories() !== ["mail"]) { exit(1); } $db->setCategories(DevStackNotices::CATEGORIES);'
          sudo -u devstackweb /usr/bin/php -r '$db=new PDO("sqlite:/var/lib/devstack-web/notifications.sqlite3"); if ((int)$db->query("SELECT COUNT(*) FROM metadata WHERE key=char(115,117,98,115,99,114,105,112,116,105,111,110)")->fetchColumn() !== 0) exit(1);'
          test ! -e /opt/devstack/push-helper.php
          test ! -e /opt/devstack/scripts/notification-push.py
      - name: Exercise the Windows notification RPC through real restricted systemd
        run: sudo env GITHUB_ACTIONS=true python3 tests/windows-notification-systemd-smoke.py
      - name: Install browser tooling
        run: |
          python3 -m venv /tmp/devstack-browser-venv
          /tmp/devstack-browser-venv/bin/pip install playwright==1.60.0
          /tmp/devstack-browser-venv/bin/python -m playwright install --with-deps chromium
      - name: Verify declarative Tools UI and instruction lifecycle on the installed stack
        env:
          DEVSTACK_E2E_ISOLATED: '1'
          NODE_EXTRA_CA_CERTS: /usr/local/share/ca-certificates/devstack-browser.crt
        run: /tmp/devstack-browser-venv/bin/python tests/extensions-browser-smoke.py
      - name: Exercise actual HTTPS, PHP, helper, services and Mailpit
        env:
          DEVSTACK_E2E_ISOLATED: '1'
          NODE_EXTRA_CA_CERTS: /usr/local/share/ca-certificates/devstack-browser.crt
        run: /tmp/devstack-browser-venv/bin/python tests/browser-smoke.py
      - name: Diagnostics on failure
        if: failure()
        run: |
          sudo journalctl -u devstackd -u nginx -u php8.5-fpm -u devstack-mailpit -u devstack-notifications.service --no-pager -n 100
          sudo tail -80 /var/log/nginx/error.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devstack-browser-verification
          path: browser-results/
          if-no-files-found: warn
          retention-days: 1
