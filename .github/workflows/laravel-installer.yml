name: Official Laravel Installer smoke test

on:
  push:
    branches: [test/windows-local-notifications]
  pull_request:
    branches: [main]
    paths:
      - 'framework-installers/**'
      - 'daemon/devstackd.py'
      - '.github/workflows/laravel-installer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      matrix: ${{ steps.kits.outputs.matrix }}
      installer: ${{ steps.kits.outputs.installer }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
      - name: Discover real installed starter kits
        id: kits
        shell: bash
        run: |
          set -Eeuo pipefail
          runner="$PWD/framework-installers/runner.py"
          mkdir -p "$HOME/projects"
          composer global require laravel/installer --no-interaction --no-ansi --no-progress --prefer-dist
          python3 -I "$runner" laravel status > "$RUNNER_TEMP/engine-status.json"
          python3 - "$RUNNER_TEMP/engine-status.json" <<'PY'
          import json, os, sys
          result = json.load(open(sys.argv[1]))["result"]
          kits = result["starter_kits"]
          assert kits and result["installed"], "Could not discover installer capabilities"
          ids = [item["id"] for item in kits]
          assert "none" in ids and len(ids) > 1
          assert len(ids) == len(set(ids)) and not any(kit.startswith("blank-") for kit in ids)
          print("Discovered frontend technologies:", ", ".join(ids))
          fields = result["installer_options"]
          assert isinstance(fields, list)
          print("Discovered installer fields:", ", ".join(field["id"] for field in fields))
          cases = [{"kit": kit, "driver": driver, "variant": "default", "options": "{}"}
                   for kit in ids for driver in ("sqlite", "mariadb")]
          # Add real representative installations for conditional options.
          # The shared resolver verifies that the requested option combination
          # really exists in this installed version before adding it.
          sys.path.insert(0, "framework-installers")
          from common import resolve_installer_options
          # Exercise no-login through the same technology ID and options
          # object the browser submits, for both supported databases.
          for kit in ids:
              if kit == "none":
                  continue
              selected = {"auth-provider": "none"}
              try:
                  resolve_installer_options(kit, fields, selected)
              except ValueError:
                  continue
              for driver in ("sqlite", "mariadb"):
                  cases.append({"kit": kit, "driver": driver, "variant": "no-auth",
                                "options": json.dumps(selected, separators=(",", ":"))})
          for kit, driver, variant, selected in (
              ("livewire", "sqlite", "class", {"livewire-components": "class"}),
              ("livewire", "mariadb", "teams", {"teams": "yes"}),
              ("react", "sqlite", "teams", {"teams": "yes"}),
              ("livewire", "sqlite", "workos", {"auth-provider": "workos"}),
              ("vue", "sqlite", "workos", {"auth-provider": "workos"}),
              ("none", "sqlite", "phpunit-boost", {"testing": "phpunit", "boost": "yes"}),
              ("none", "sqlite", "skip-assets", {"assets": "no"}),
              ("livewire", "sqlite", "local-mail", {}),
          ):
              if kit not in ids:
                  continue
              try:
                  resolve_installer_options(kit, fields, selected)
              except ValueError:
                  continue
              cases.append({"kit": kit, "driver": driver, "variant": variant,
                            "options": json.dumps(selected, separators=(",", ":"))})
          matrix = {"include": cases}
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              print("matrix=" + json.dumps(matrix, separators=(",", ":")), file=out)
              print("installer=" + result["installed"], file=out)
          PY
  install:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: ci_root_fixture
          MARIADB_DATABASE: fixture_db
          MARIADB_USER: fixture_user
          MARIADB_PASSWORD: fixture_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, bcmath, intl, curl, dom, zip, pdo_sqlite, sqlite3, pdo_mysql, fileinfo
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Standard installer with selected database
        shell: bash
        env:
          KIT: ${{ matrix.kit }}
          DRIVER: ${{ matrix.driver }}
          INSTALLER_VERSION: ${{ needs.discover.outputs.installer }}
          OPTIONS_JSON: ${{ matrix.options }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -Eeuo pipefail
          test "$(id -u)" -ne 0
          git config --global user.name "DevStack CI"
          git config --global user.email "ci@example.invalid"
          mkdir -p "$HOME/projects"
          if [[ "$VARIANT" = local-mail ]]; then
            sudo bash scripts/install-mailpit.sh
          fi
          slug="ci-$KIT"
          test ! -e "$HOME/projects/$slug"
          runner="$PWD/framework-installers/runner.py"
          composer global require "laravel/installer:$INSTALLER_VERSION" --no-interaction --no-ansi --no-progress --prefer-dist
          python3 -I "$runner" laravel status > "$RUNNER_TEMP/engine-status.json"
          python3 - "$RUNNER_TEMP/engine-status.json" "$KIT" "$INSTALLER_VERSION" <<'PY'
          import json, sys
          info = json.load(open(sys.argv[1]))["result"]
          assert info["installed"] == sys.argv[3]
          assert sys.argv[2] in [kit["id"] for kit in info["starter_kits"]]
          PY
          python3 -I "$runner" laravel check
          if [[ "$DRIVER" = mariadb ]]; then
            settings="{\"url\":\"https://$slug.test\",\"db_name\":\"fixture_db\",\"db_user\":\"fixture_user\",\"db_password\":\"fixture_password\"}"
          else
            settings="{\"url\":\"https://$slug.test\"}"
          fi
          settings="$(SETTINGS="$settings" python3 -c 'import os,json; data=json.loads(os.environ["SETTINGS"]); data["installer_options"]=json.loads(os.environ["OPTIONS_JSON"]); data["local_mail"]=os.environ["VARIANT"]=="local-mail"; print(json.dumps(data))')"
          if ! printf '%s' "$settings" | python3 -I "$runner" laravel scaffold "$slug" "$KIT" "$DRIVER" > "$RUNNER_TEMP/scaffold.json"; then
            echo "Official installer failed; CI fixture diagnostics:"
            find "$HOME/.cache/devstack/engines" -type f -name '*.log' -exec tail -n 120 {} +
            exit 1
          fi
          python3 - "$RUNNER_TEMP/scaffold.json" <<'PY'
          import json, os, sys
          result = json.load(open(sys.argv[1]))["result"]
          assert result["webroot"] == "public"
          assert result.get("local_mail", False) == (os.environ["VARIANT"] == "local-mail")
          for key, value in json.loads(os.environ["OPTIONS_JSON"]).items():
              assert result["installer_options"][key] == value
          PY
          cd "$HOME/projects/$slug"
          composer check-platform-reqs
          composer show laravel/framework --format=json > "$RUNNER_TEMP/framework-composer.json"
          printf '["%s"]' "$slug" | python3 -I "$GITHUB_WORKSPACE/daemon/project_frameworks.py" > "$RUNNER_TEMP/framework-detected.json"
          python3 - "$slug" "$RUNNER_TEMP/framework-composer.json" "$RUNNER_TEMP/framework-detected.json" <<'PY'
          import json, sys
          composer = json.load(open(sys.argv[2]))
          detected = json.load(open(sys.argv[3]))[sys.argv[1]]
          versions = [version.lstrip('* ').lstrip('v') for version in composer['versions']]
          assert detected['name'] == 'Laravel' and detected['version'] in versions, (detected, versions)
          PY
          case "$KIT" in
            livewire)
              composer show livewire/livewire
              if python3 -c 'import json,os; raise SystemExit(json.loads(os.environ["OPTIONS_JSON"]).get("auth-provider") == "none")'; then
                composer show livewire/flux
              fi ;;
            react|vue|svelte)
              STACK="$KIT" node -e 'const p=require("./package.json"); if (!({...p.dependencies,...p.devDependencies})[process.env.STACK]) process.exit(1)' ;;
          esac
          python3 - "$RUNNER_TEMP/scaffold.json" <<'PY'
          import json, pathlib, sys
          chosen = json.load(open(sys.argv[1]))["result"]["installer_options"]
          lock = json.load(open("composer.lock"))
          packages = {p["name"] for p in lock.get("packages", []) + lock.get("packages-dev", [])}
          assert "public" == json.load(open(sys.argv[1]))["result"]["webroot"]
          assert pathlib.Path("public/index.php").is_file()
          if chosen.get("testing") == "phpunit":
              assert "phpunit/phpunit" in packages and "pestphp/pest" not in packages
          else:
              assert "pestphp/pest" in packages
          if chosen.get("boost") == "yes":
              assert "laravel/boost" in packages
          if chosen.get("auth-provider") == "workos":
              assert "laravel/workos" in packages
          if chosen.get("auth-provider") == "none":
              assert not {"laravel/fortify", "laravel/workos"} & packages
              assert "teams" not in chosen and "livewire-components" not in chosen
              assert not list(pathlib.Path("database/migrations").glob("*create_teams_table.php"))
          if chosen.get("teams") == "yes":
              assert list(pathlib.Path("database/migrations").glob("*create_teams_table.php"))
          if chosen.get("livewire-components") == "class":
              assert pathlib.Path("app/Livewire/Settings").is_dir()
          if chosen.get("assets") == "no":
              assert not pathlib.Path("public/build/manifest.json").exists()
          else:
              assert pathlib.Path("public/build/manifest.json").stat().st_size > 0
          PY
          grep -Fxq "APP_URL=https://$slug.test" .env
          grep -Fxq "DB_CONNECTION=$DRIVER" .env
          grep -qE '^APP_KEY=base64:.+' .env
          test "$(stat -c '%a' .env)" = 600
          if [[ "$DRIVER" = mariadb ]]; then
            grep -Fxq 'DB_HOST=127.0.0.1' .env
            grep -Fxq 'DB_DATABASE=fixture_db' .env
            grep -Fxq 'DB_USERNAME=fixture_user' .env
            grep -Fxq 'DB_PASSWORD=fixture_password' .env
            ! grep -q 'fixture_password' .env.example
            php -r '$db = new PDO("mysql:host=127.0.0.1;port=3306;dbname=fixture_db", "fixture_user", "fixture_password"); if ((int)$db->query("SELECT COUNT(*) FROM migrations")->fetchColumn() < 1) exit(1);'
            python3 - <<'PY'
          import pathlib, sqlite3
          db = pathlib.Path("database/database.sqlite").resolve()
          if db.exists():
              with sqlite3.connect(db.as_uri() + "?mode=ro", uri=True) as conn:
                  assert conn.execute("SELECT count(*) FROM sqlite_master WHERE type='table'").fetchone()[0] == 0
          print("No SQLite migrations in MariaDB mode.")
          PY
          else
            python3 - <<'PY'
          import pathlib, sqlite3
          db = pathlib.Path("database/database.sqlite").resolve()
          assert db.is_file()
          with sqlite3.connect(db.as_uri() + "?mode=ro", uri=True) as conn:
              assert conn.execute("SELECT count(*) FROM migrations").fetchone()[0] > 0
          PY
            php -r '$db = new PDO("mysql:host=127.0.0.1;port=3306;dbname=fixture_db", "fixture_user", "fixture_password"); if ((int)$db->query("SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE()")->fetchColumn() !== 0) exit(1);'
          fi
          php artisan migrate:status --no-interaction --no-ansi
          if [[ "$VARIANT" = local-mail ]]; then
            grep -Fxq 'MAIL_MAILER=smtp' .env
            grep -Fxq 'MAIL_HOST=127.0.0.1' .env
            grep -Fxq 'MAIL_PORT=1025' .env
            grep -Fxq "MAIL_FROM_ADDRESS=hello@$slug.test" .env
            php -r 'require "vendor/autoload.php"; $app = require "bootstrap/app.php"; $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap(); if (config("mail.default") !== "smtp" || config("mail.mailers.smtp.host") !== "127.0.0.1" || (int)config("mail.mailers.smtp.port") !== 1025) exit(1); Illuminate\Support\Facades\Mail::raw("DevStack local mail fixture", function ($m) { $m->to("recipient@example.test")->subject("DevStack Laravel SMTP smoke"); });'
            python3 - <<'PY'
          import json, time, urllib.request
          for _ in range(20):
              data = json.load(urllib.request.urlopen("http://127.0.0.1:8025/api/v1/messages", timeout=3))
              if any(m["Subject"] == "DevStack Laravel SMTP smoke" and m["From"]["Address"] == "hello@ci-livewire.test" for m in data.get("messages") or []):
                  print("Laravel SMTP delivery captured locally.")
                  break
              time.sleep(0.5)
          else:
              raise SystemExit("Laravel fixture not captured")
          PY
          fi
      - name: Refuse an existing directory and extra migrations
        shell: bash
        env:
          KIT: ${{ matrix.kit }}
          DRIVER: ${{ matrix.driver }}
        run: |
          if printf '%s' '{"url":"https://existing.test"}' | python3 -I framework-installers/runner.py laravel scaffold "ci-$KIT" "$KIT" "$DRIVER"; then
            echo 'Adapter unexpectedly accepted an existing project' >&2
            exit 1
          fi
          if python3 -I framework-installers/runner.py laravel migrate "ci-$KIT"; then
            echo 'Adapter unexpectedly accepted a separate migration operation' >&2
            exit 1
          fi
          test -s "$HOME/projects/ci-$KIT/artisan"
