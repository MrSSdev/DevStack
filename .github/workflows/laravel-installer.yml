name: Official Laravel Installer smoke test

on:
  pull_request:
    branches: [main]
    paths:
      - 'framework-installers/**'
      - 'daemon/devstackd.py'
      - '.github/workflows/laravel-installer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        kit: [none, livewire]
        driver: [sqlite, mariadb]
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: ci_root_fixture
          MARIADB_DATABASE: fixture_db
          MARIADB_USER: fixture_user
          MARIADB_PASSWORD: fixture_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, bcmath, intl, curl, dom, zip, pdo_sqlite, sqlite3, pdo_mysql, fileinfo
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Standard installer with selected database
        shell: bash
        env:
          KIT: ${{ matrix.kit }}
          DRIVER: ${{ matrix.driver }}
        run: |
          set -Eeuo pipefail
          test "$(id -u)" -ne 0
          git config --global user.name "DevStack CI"
          git config --global user.email "ci@example.invalid"
          mkdir -p "$HOME/projects"
          slug="devstack-ci-$KIT"
          test ! -e "$HOME/projects/$slug"
          runner="$PWD/framework-installers/runner.py"
          python3 -I "$runner" laravel status > "$RUNNER_TEMP/engine-status.json"
          if python3 -c 'import json,sys; sys.exit(0 if json.load(open(sys.argv[1]))["result"]["installed"] is None else 1)' "$RUNNER_TEMP/engine-status.json"; then
            python3 -I "$runner" laravel install-tool
          fi
          python3 -I "$runner" laravel status
          python3 -I "$runner" laravel check
          if [[ "$DRIVER" = mariadb ]]; then
            settings="{\"url\":\"https://$slug.test\",\"db_name\":\"fixture_db\",\"db_user\":\"fixture_user\",\"db_password\":\"fixture_password\"}"
          else
            settings="{\"url\":\"https://$slug.test\"}"
          fi
          if ! printf '%s' "$settings" | python3 -I "$runner" laravel scaffold "$slug" "$KIT" "$DRIVER"; then
            echo "Official installer failed; CI fixture diagnostics:"
            find "$HOME/.cache/devstack/engines" -type f -name '*.log' -exec tail -n 120 {} +
            exit 1
          fi
          cd "$HOME/projects/$slug"
          composer check-platform-reqs
          composer show laravel/framework
          if [[ "$KIT" = livewire ]]; then
            composer show livewire/livewire
            composer show livewire/flux
          fi
          test -s public/build/manifest.json
          grep -Fxq "APP_URL=https://$slug.test" .env
          grep -Fxq "DB_CONNECTION=$DRIVER" .env
          grep -qE '^APP_KEY=base64:.+' .env
          test "$(stat -c '%a' .env)" = 600
          if [[ "$DRIVER" = mariadb ]]; then
            grep -Fxq 'DB_HOST=127.0.0.1' .env
            grep -Fxq 'DB_DATABASE=fixture_db' .env
            grep -Fxq 'DB_USERNAME=fixture_user' .env
            grep -Fxq 'DB_PASSWORD=fixture_password' .env
            ! grep -q 'fixture_password' .env.example
            php -r '$db = new PDO("mysql:host=127.0.0.1;port=3306;dbname=fixture_db", "fixture_user", "fixture_password"); if ((int)$db->query("SELECT COUNT(*) FROM migrations")->fetchColumn() < 1) exit(1);'
            python3 - <<'PY'
          import pathlib, sqlite3
          db = pathlib.Path("database/database.sqlite").resolve()
          if db.exists():
              with sqlite3.connect(db.as_uri() + "?mode=ro", uri=True) as conn:
                  assert conn.execute("SELECT count(*) FROM sqlite_master WHERE type='table'").fetchone()[0] == 0
          print("No SQLite migrations in MariaDB mode.")
          PY
          else
            python3 - <<'PY'
          import pathlib, sqlite3
          db = pathlib.Path("database/database.sqlite").resolve()
          assert db.is_file()
          with sqlite3.connect(db.as_uri() + "?mode=ro", uri=True) as conn:
              assert conn.execute("SELECT count(*) FROM migrations").fetchone()[0] > 0
          PY
            php -r '$db = new PDO("mysql:host=127.0.0.1;port=3306;dbname=fixture_db", "fixture_user", "fixture_password"); if ((int)$db->query("SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE()")->fetchColumn() !== 0) exit(1);'
          fi
          php artisan migrate:status --no-interaction --no-ansi
      - name: Refuse an existing directory and extra migrations
        shell: bash
        env:
          KIT: ${{ matrix.kit }}
          DRIVER: ${{ matrix.driver }}
        run: |
          if printf '%s' '{"url":"https://existing.test"}' | python3 -I framework-installers/runner.py laravel scaffold "devstack-ci-$KIT" "$KIT" "$DRIVER"; then
            echo 'Adapter unexpectedly accepted an existing project' >&2
            exit 1
          fi
          if python3 -I framework-installers/runner.py laravel migrate "devstack-ci-$KIT"; then
            echo 'Adapter unexpectedly accepted a separate migration operation' >&2
            exit 1
          fi
          test -s "$HOME/projects/devstack-ci-$KIT/artisan"
