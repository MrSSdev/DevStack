name: DevStack Windows Widgets

on:
  push:
    branches: [main, feature/windows-widgets]
    paths: ['windows/widgets/**', '.github/workflows/widgets.yml']
  pull_request:
    paths: ['windows/widgets/**', '.github/workflows/widgets.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: widgets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  widgets-x64:
    name: Windows widgets x64 MSIX
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: microsoft/setup-msbuild@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate images and validate widget manifest
        shell: pwsh
        run: |
          ./windows/widgets/scripts/New-WidgetAssets.ps1
          ./windows/widgets/scripts/Test-WidgetManifest.ps1

      - name: Logic tests without starting WSL
        shell: pwsh
        run: |
          $env:DEVSTACK_WIDGET_PREVIEWS = Join-Path (Get-Location) 'widgets-previews'
          dotnet run --project windows/widgets/tests/WidgetChecks.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Widget logic tests failed' }

      - name: Render dark and light card states and check bounds
        shell: pwsh
        run: |
          npm install --prefix .widget-preview --no-audit --no-fund --ignore-scripts --no-package-lock adaptivecards@2.11.0 playwright@1.56.1
          if ($LASTEXITCODE -ne 0) { throw 'Preview dependency install failed' }
          node .widget-preview/node_modules/playwright/cli.js install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Preview browser install failed' }
          $env:NODE_PATH = Join-Path (Get-Location) '.widget-preview/node_modules'
          node windows/widgets/scripts/Render-WidgetPreviews.cjs widgets-previews
          if ($LASTEXITCODE -ne 0) { throw 'Widget render/bounds tests failed' }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DevStack-Widgets-Preview
          path: widgets-previews/
          retention-days: 14
          if-no-files-found: warn

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          dotnet restore windows/widgets/DevStack.Widgets.csproj --runtime win-x64
          if ($LASTEXITCODE -ne 0) { throw 'Widget NuGet restore failed' }

      - name: Build and package unsigned x64 MSIX
        shell: pwsh
        run: |
          $args = @('windows/widgets/DevStack.Widgets.csproj', '/restore', '/p:Configuration=Release', '/p:Platform=x64', '/p:RuntimeIdentifier=win-x64', '/p:SelfContained=true', '/p:GenerateAppxPackageOnBuild=true', '/p:AppxPackageSigningEnabled=false', '/p:AppxBundle=Never', '/p:UapAppxPackageBuildMode=SideloadOnly')
          $args += '/p:AppxPackageDir=' + (Join-Path (Get-Location) 'widgets-packages\')
          & msbuild @args
          if ($LASTEXITCODE -ne 0) { throw 'MSIX build failed' }

      - name: Locate generated MSIX
        id: package
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem 'widgets-packages' -Recurse -File -Filter '*.msix' | Where-Object { $_.Name -like 'DevStack.Widgets_*.msix' })
          if ($packages.Count -ne 1) { throw "Expected one MSIX, got $($packages.Count)" }
          "path=$($packages[0].FullName)" >> $env:GITHUB_OUTPUT

      - name: Sign MSIX with temporary development certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=DevStack Widgets Development' -CertStoreLocation 'Cert:\CurrentUser\My' -KeyExportPolicy Exportable -KeyLength 3072 -HashAlgorithm SHA256 -NotAfter (Get-Date).AddMonths(12)
          New-Item -ItemType Directory -Force -Path 'widgets-packages\install' | Out-Null
          Export-Certificate -Cert $cert -FilePath 'widgets-packages\install\DevStack-Widgets-Dev.cer' | Out-Null
          $pass = [Guid]::NewGuid().ToString('N')
          $pfx = Join-Path $env:RUNNER_TEMP 'widgets-sign.pfx'
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString $pass -AsPlainText -Force) | Out-Null
          try {
            $tools = @(Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe | Where-Object { $_.FullName -match '\\x64\\signtool.exe$' } | Sort-Object FullName -Descending)
            if (-not $tools) { throw 'Windows SDK signtool x64 not found' }
            & $tools[0].FullName sign /fd SHA256 /f $pfx /p $pass '${{ steps.package.outputs.path }}'
            if ($LASTEXITCODE -ne 0) { throw 'MSIX signing failed' }
          }
          finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
            Remove-Item -Path ("Cert:\CurrentUser\My\" + $cert.Thumbprint) -Force -ErrorAction SilentlyContinue
          }
          Copy-Item '${{ steps.package.outputs.path }}' 'widgets-packages\install\DevStack-Widgets-x64.msix'
          'Test signer from this workflow only. Verify the source before trusting this CER. Version 0.2.0.0; two LARGE native widgets; no resize menu is intentional.' | Out-File 'widgets-packages\install\READ-ME-FIRST.txt' -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: DevStack-Windows-Widgets-x64
          path: widgets-packages/install/*
          retention-days: 14
          if-no-files-found: error
