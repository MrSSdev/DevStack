name: DevStack Windows Widgets

on:
  push:
    branches: [main, feature/windows-widgets]
    paths: ['windows/widgets/**', '.github/workflows/widgets.yml']
  pull_request:
    paths: ['windows/widgets/**', '.github/workflows/widgets.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: widgets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  telemetry:
    name: Read-only Linux metrics
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Authorization and procfs tests
        run: |
          python3 -m unittest discover -s windows/widgets/telemetry -p 'test_*.py' -v
          python3 -m unittest discover -s windows/widgets/services -p 'test_*.py' -v

  widgets-x64:
    name: Windows widgets x64 MSIX
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: microsoft/setup-msbuild@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate approved WSL page and widget assets
        shell: pwsh
        run: |
          python windows/widgets/scripts/Build-WslWeb.py
          if ($LASTEXITCODE -ne 0) { throw 'Approved prototype extraction failed' }
          python windows/widgets/scripts/Build-DevStackWeb.py
          if ($LASTEXITCODE -ne 0) { throw 'Approved DevStack extraction failed' }
          ./windows/widgets/scripts/New-WidgetAssets.ps1
          ./windows/widgets/scripts/Test-WidgetManifest.ps1
          [xml]$manifest = Get-Content windows/widgets/Package.appxmanifest -Raw
          $wsl = $manifest.SelectSingleNode("//*[local-name()='Definition' and @Id='DevStack_WSL']")
          $dev = $manifest.SelectSingleNode("//*[local-name()='Definition' and @Id='DevStack_Services']")
          if ($wsl.WebRequestFilter -ne 'https://devstack-widgets.invalid/*' -or $dev.WebRequestFilter -ne 'https://devstack-services.invalid/*') { throw 'Both web widget origins must be isolated' }

      - name: Logic and actual provider bridge tests without starting WSL
        shell: pwsh
        run: |
          $env:DEVSTACK_WIDGET_PREVIEWS = Join-Path (Get-Location) 'widgets-previews'
          dotnet run --project windows/widgets/tests/WidgetChecks.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Existing widget logic tests failed' }
          dotnet run --project windows/widgets/tests/Bridge/BridgeChecks.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'WSL message/confirmation tests failed' }

      - name: Render unchanged cards and approved production WSL page
        shell: pwsh
        run: |
          npm install --prefix .widget-preview --no-audit --no-fund --ignore-scripts --no-package-lock adaptivecards@2.11.0 playwright@1.56.1
          if ($LASTEXITCODE -ne 0) { throw 'Preview dependency install failed' }
          node .widget-preview/node_modules/playwright/cli.js install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Preview browser install failed' }
          $env:NODE_PATH = Join-Path (Get-Location) '.widget-preview/node_modules'
          node windows/widgets/scripts/Render-WidgetPreviews.cjs widgets-previews
          if ($LASTEXITCODE -ne 0) { throw 'Existing card bounds tests failed' }
          node windows/widgets/scripts/Test-WslWeb.cjs wsl-approved-previews
          if ($LASTEXITCODE -ne 0) { throw 'Approved WSL visual/interaction tests failed' }
          node windows/widgets/scripts/Test-DevStackWeb.cjs services-approved-previews
          if ($LASTEXITCODE -ne 0) { throw 'Approved DevStack visual/interaction tests failed' }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DevStack-WSL-Approved-Preview
          path: wsl-approved-previews/
          retention-days: 14
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DevStack-Widgets-Preview
          path: widgets-previews/
          retention-days: 14
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DevStack-Services-Approved-Preview
          path: services-approved-previews/
          retention-days: 14
          if-no-files-found: warn

      - name: Build dashboard static deep-link update
        shell: pwsh
        run: |
          Push-Location frontend
          try {
            npm install --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw 'Frontend dependency install failed' }
            npm run build
            if ($LASTEXITCODE -ne 0) { throw 'Frontend build failed' }
          } finally { Pop-Location }
          Compress-Archive -Path backend/public/index.html, backend/public/assets -DestinationPath DevStack-Frontend.zip

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          dotnet restore windows/widgets/DevStack.Widgets.csproj --runtime win-x64
          if ($LASTEXITCODE -ne 0) { throw 'Widget NuGet restore failed' }

      - name: Build and package unsigned x64 MSIX
        shell: pwsh
        run: |
          $args = @('windows/widgets/DevStack.Widgets.csproj', '/restore', '/p:Configuration=Release', '/p:Platform=x64', '/p:RuntimeIdentifier=win-x64', '/p:SelfContained=true', '/p:GenerateAppxPackageOnBuild=true', '/p:AppxPackageSigningEnabled=false', '/p:AppxBundle=Never', '/p:UapAppxPackageBuildMode=SideloadOnly')
          $args += '/p:AppxPackageDir=' + (Join-Path (Get-Location) 'widgets-packages\')
          & msbuild @args
          if ($LASTEXITCODE -ne 0) { throw 'MSIX build failed' }

      - name: Locate generated MSIX
        id: package
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem 'widgets-packages' -Recurse -File -Filter '*.msix' | Where-Object { $_.Name -like 'DevStack.Widgets_*.msix' })
          if ($packages.Count -ne 1) { throw "Expected one MSIX, got $($packages.Count)" }
          "path=$($packages[0].FullName)" >> $env:GITHUB_OUTPUT

      - name: Sign and assemble complete WSL installer
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=DevStack Widgets Development' -CertStoreLocation 'Cert:\CurrentUser\My' -KeyExportPolicy Exportable -KeyLength 3072 -HashAlgorithm SHA256 -NotAfter (Get-Date).AddMonths(12)
          New-Item -ItemType Directory -Force -Path 'widgets-packages\install\telemetry' | Out-Null
          Export-Certificate -Cert $cert -FilePath 'widgets-packages\install\DevStack-Widgets-Dev.cer' | Out-Null
          $pass = [Guid]::NewGuid().ToString('N')
          $pfx = Join-Path $env:RUNNER_TEMP 'widgets-sign.pfx'
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString $pass -AsPlainText -Force) | Out-Null
          try {
            $tools = @(Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe | Where-Object { $_.FullName -match '\\x64\\signtool.exe$' } | Sort-Object FullName -Descending)
            if (-not $tools) { throw 'Windows SDK signtool x64 not found' }
            & $tools[0].FullName sign /fd SHA256 /f $pfx /p $pass '${{ steps.package.outputs.path }}'
            if ($LASTEXITCODE -ne 0) { throw 'MSIX signing failed' }
          }
          finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
            Remove-Item -Path ("Cert:\CurrentUser\My\" + $cert.Thumbprint) -Force -ErrorAction SilentlyContinue
          }
          Copy-Item '${{ steps.package.outputs.path }}' 'widgets-packages\install\DevStack-Widgets-x64.msix'
          Copy-Item windows/widgets/scripts/Install-Widgets.ps1, windows/widgets/scripts/Install-WslTelemetry.ps1 'widgets-packages/install/'
          Copy-Item windows/widgets/telemetry/collector.py, windows/widgets/telemetry/devstack-widget-metrics.socket, windows/widgets/telemetry/devstack-widget-metrics@.service 'widgets-packages/install/telemetry/'
          New-Item -ItemType Directory -Force -Path 'widgets-packages/install/services' | Out-Null
          Copy-Item windows/widgets/services/bridge.py, windows/widgets/services/setup.py, windows/widgets/services/*.socket, windows/widgets/services/*.service 'widgets-packages/install/services/'
          Copy-Item windows/widgets/scripts/Install-DevStackWidget.ps1 'widgets-packages/install/'
          Copy-Item DevStack-Frontend.zip 'widgets-packages/install/'
          Copy-Item windows/widgets/DEVSTACK-0.4.md 'widgets-packages/install/READ-ME-FIRST.md'
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path windows/widgets/scripts/Install-DevStackWidget.ps1), [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw 'DevStack installer syntax failed' }
          $sig = Get-AuthenticodeSignature 'widgets-packages/install/DevStack-Widgets-x64.msix'
          $public = Get-PfxCertificate 'widgets-packages/install/DevStack-Widgets-Dev.cer'
          if (!$sig.SignerCertificate -or $sig.SignerCertificate.Thumbprint -ne $public.Thumbprint) { throw 'Published signer pair mismatch' }

      - uses: actions/upload-artifact@v4
        with:
          name: DevStack-Windows-Widgets-x64
          path: widgets-packages/install/*
          retention-days: 14
          if-no-files-found: error
